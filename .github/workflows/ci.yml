name: ci

on:
  push:
    branches: [main, linux, linux-platform, 'linux/**', windows, windows-platform, 'windows/**']
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        part: [lint, test]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: matrix.part == 'lint'
        run: python3 scripts/protocol_fixtures.py append-only --base "$PROTOCOL_BASE"
        env:
          PROTOCOL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 scripts/check-desktop-macos.py --part "${{ matrix.part }}"
      - if: matrix.part == 'test'
        run: python3 scripts/protocol_fixtures.py last-release

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config binutils
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 scripts/check-headless.py --target "${{ matrix.target }}"

  linux-desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        part: [lint, test]
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config clang cmake libssl-dev libfontconfig1-dev libfreetype-dev
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libvulkan-dev
          binutils unzip
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 scripts/check-desktop-linux.py --target "${{ matrix.target }}" --part "${{ matrix.part }}"

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # ring builds its ARM64 assembly with clang.
      - run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - run: clang --version
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Windows workspace with the MSVC and SDK environment
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual Studio C++ tools not found' }
          $architecture = if ('${{ matrix.target }}' -like 'aarch64-*') { 'arm64' } else { 'amd64' }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch $architecture -HostArch $architecture -SkipAutomaticLocation
          python scripts/check-windows.py --target "${{ matrix.target }}"
